name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content '.\src\DKImageAIEditor\DKImageAIEditor.csproj'
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version not found.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Build and package
        shell: pwsh
        run: .\publish.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DK-Image-AI-Editor-v${{ steps.version.outputs.version }}-win-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DK Image AI Editor v${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist/*.zip
